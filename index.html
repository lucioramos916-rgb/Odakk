<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Inmersivo</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
    :root {
        --primary-color: #e53935; /* Rojo */
        --primary-hover: #c62828;
        --bg-light: #f8f9fa;
        --chat-bg: #fff5f5; 
        --border-color: #e9ecef;
        /* Variables calculadas para cabecera e input fijos */
        --header-height: 60px;
        --input-height: 70px;
    }

    * {
        box-sizing: border-box;
    }

    /* 1. Bloquear scroll y asegurar 100vh en móvil y escritorio */
    html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Evita que toda la página se mueva */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-light);
        overscroll-behavior: none; /* Evita rebotes extraños en iOS/Android */
        position: fixed; /* Fija la posición para evitar scroll en iOS */
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    /* 2. Contenedor principal del chat (La "App") */
    #chat-screen {
        display: none; /* Oculto hasta login */
        width: 100%;
        height: 100%; /* Por defecto ocupa todo el alto */
        max-width: 440px; /* Opcional: ancho máximo en escritorio */
        background: #ffffff;
        flex-direction: column;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        overflow: hidden; /* Importante: recorta el contenido interno */
        position: relative;
    }

    /* Estilo para escritorio: flotando en el centro */
    @media (min-width: 480px) {
        #chat-screen {
            height: 85vh; /* Un poco menos del alto total */
            max-height: 750px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }
    }

    /* Cabecera Fija */
    .chat-header {
        height: var(--header-height);
        background: #ffffff;
        color: #1a1a1a;
        padding: 0 20px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0; /* Evita que se encoja */
        z-index: 10;
    }

    /* Área de Mensajes (Scroll Interno) */
    .chat-messages {
        flex: 1; /* Ocupa todo el espacio central restante */
        padding: 20px;
        overflow-y: auto; /* Habilita scroll SOLO aquí */
        background: var(--chat-bg);
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth; /* Animación al hacer scroll */
        
        /* Soporte para navegadores móviles al hacer scroll */
        -webkit-overflow-scrolling: touch; 
    }

    /* Estilos de mensajes (sin cambios, solo para referencia) */
    .message { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .message.sent { background: #ffffff; color: #212529; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #f1f3f5; }
    .message.received { background: var(--primary-color); color: #ffffff; align-self: flex-start; border-bottom-left-radius: 4px; }
    .message .user { font-size: 11px; font-weight: 700; display: block; margin-bottom: 4px; opacity: 0.8; }

    /* Barra de Entrada Fija */
    .chat-input {
        height: var(--input-height);
        display: flex;
        align-items: center;
        padding: 10px 16px;
        background: #ffffff;
        gap: 10px;
        border-top: 1px solid var(--border-color);
        flex-shrink: 0; /* Evita que se encoja */
        z-index: 10;
    }

    .chat-input input {
        flex: 1;
        height: 45px; /* Alto fijo del input */
        padding: 0 16px;
        border: 1px solid var(--border-color);
        border-radius: 24px;
        outline: none;
        font-size: 14px;
        background: var(--bg-light);
        transition: all 0.2s;
    }

    .action-btn {
        background: var(--primary-color);
        color: white;
        border: none;
        width: 45px; /* Botones cuadrados/circulares */
        height: 45px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        flex-shrink: 0;
    }

    .action-btn:hover { background: var(--primary-hover); }
    .action-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* Pantalla de Login (centrada) */
    #login-screen {
        background: #ffffff;
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 90%;
        max-width: 360px;
        border: 1px solid var(--border-color);
        z-index: 100;
    }
    #login-screen input { padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--border-color); }
    #login-screen button { background: var(--primary-color); color: white; padding: 14px; border-radius: 12px; border: none; font-weight: 600;}

</style>
</head>
<body>

   <!-- PANTALLA DE INGRESO -->
<div id="login-screen">
    <h2>Bienvenido</h2>
    <p>Por favor, ingresa tu nombre para continuar.</p>
    <input type="text" id="login-name" placeholder="Ej: Lucio, Madre, Padre..." autocomplete="off" />
    <button onclick="joinChat()">Entrar al Chat</button>
</div>

<!-- PANTALLA DEL CHAT -->
<div id="chat-screen">
    <div class="chat-header">
        <span>WhatsApp Inmersivo</span>
        <div id="typing-indicator"></div>
        <span id="display-name"></span>
    </div>
    <div class="chat-messages" id="messages-container"></div>
    <div class="chat-input">
        <input type="text" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off" />
        
        <!-- Botón de Micrófono SVG -->
        <button class="action-btn" id="mic-btn" title="Enviar nota de voz">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>

        <!-- Botón de Enviar SVG -->
        <button class="action-btn" onclick="sendMessage()" title="Enviar mensaje">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>
</div>

    <script>
        
        // Registro del Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then((reg) => console.log('SW registrado con éxito, scope:', reg.scope))
                    .catch((err) => console.error('Fallo al registrar SW:', err));
            });
        }

        const socket = io();
        let myName = "";
        let myReadingLanguage = "es";

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const displayName = document.getElementById('display-name');
        const typingIndicator = document.getElementById('typing-indicator');

        // Pedir permiso web nativo
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        async function joinChat() {
            const nameInput = document.getElementById('login-name').value.trim();
            if (!nameInput) {
                alert("Debes ingresar un nombre.");
                return;
            }

            myName = nameInput;
            
            if (myName.toLowerCase() === 'lucio') {
                myReadingLanguage = 'en';
            } else {
                myReadingLanguage = 'es';
            }

            displayName.innerText = "Usuario: " + myName;

            // Registrar las push pasando correctamente el nombre del usuario
            try {
                await suscribirAPush(myName);
            } catch (error) {
                console.error("Fallo al registrar push:", error);
            }

            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            socket.emit('chat message', { user: myName, text: text });
            messageInput.value = '';
            socket.emit('stop typing', { user: myName });
        }

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        let typingTimeout;
        messageInput.addEventListener('input', () => {
            socket.emit('typing', { user: myName });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('stop typing', { user: myName });
            }, 1000);
        });

        socket.on('chat message', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            
            if (data.user === myName) {
                msgDiv.classList.add('sent');
            } else {
                msgDiv.classList.add('received');
            }

            const textToShow = myReadingLanguage === 'en' ? data.text_en : data.text_es;

            msgDiv.innerHTML = `<span class="user">${data.user}</span>${textToShow}`;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });

        socket.on('typing', (data) => {
            if (data.user !== myName) {
                typingIndicator.innerText = `${data.user} está escribiendo... 💬`;
            }
        });

        socket.on('stop typing', (data) => {
            if (data.user !== myName) {
                typingIndicator.innerText = '';
            }
        });

        // Función corregida con tu clave VAPID real y el parámetro correcto
        async function suscribirAPush(nombreUsuario) {
            if ('serviceWorker' in navigator) {
                const registration = await navigator.serviceWorker.ready;
                
                const publicVapidKey = 'BJMPG84wwiQAVAEAl5a2la4cbpssS6ODOyIsLeh-ea6KhoGiXEXWGw22SxyE6hc6SlO9SQGG9-TV7VDIWJDZojg';

                // Convertir la clave VAPID a Uint8Array (vital para móviles)
                function urlBase64ToUint8Array(base64String) {
                    const padding = '='.repeat((4 - base64String.length % 4) % 4);
                    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
                    const rawData = window.atob(base64);
                    const outputArray = new Uint8Array(rawData.length);
                    for (let i = 0; i < rawData.length; ++i) {
                        outputArray[i] = rawData.charCodeAt(i);
                    }
                    return outputArray;
                }

                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                });

                await fetch('/subscribe', {
                    method: 'POST',
                    body: JSON.stringify({ user: nombreUsuario, subscription }),
                    headers: { 'content-type': 'application/json' }
                });
                
                console.log("Push registrado con éxito para:", nombreUsuario);
            }
        }
    </script>
</body>
</html>
